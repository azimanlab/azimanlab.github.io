<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muhammad Aziman — Tukang Repair Machine</title>
  <style>
    :root {
      --bg: #05070d;
      --card: #0d1220;
      --border: rgba(88, 166, 255, 0.18);
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --orange: #f78166;
      --yellow: #d29922;
      --glow: rgba(88, 166, 255, 0.45);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      color: var(--text);
      line-height: 1.6;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.5;
      animation: float 16s ease-in-out infinite;
      pointer-events: none;
      z-index: 1;
    }

    .orb-1 {
      width: 380px;
      height: 380px;
      top: -120px;
      left: -100px;
      background: radial-gradient(circle, #1f6feb, transparent 70%);
    }

    .orb-2 {
      width: 420px;
      height: 420px;
      bottom: -160px;
      right: -120px;
      background: radial-gradient(circle, var(--orange), transparent 70%);
      animation-delay: -8s;
    }

    .orb-3 {
      width: 220px;
      height: 220px;
      top: 55%;
      left: -80px;
      background: radial-gradient(circle, var(--green), transparent 70%);
      animation-delay: -4s;
      opacity: 0.35;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -30px) scale(1.1); }
    }

    .card {
      position: relative;
      z-index: 2;
      background: linear-gradient(160deg, rgba(22, 27, 39, 0.92), rgba(13, 18, 32, 0.96));
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.75rem 2.25rem;
      width: min(100%, 480px);
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.3),
        0 20px 60px rgba(0, 0, 0, 0.6),
        0 0 40px var(--glow);
      backdrop-filter: blur(20px);
      animation: cardIn 1s cubic-bezier(0.22, 1, 0.36, 1) both;
      transition: transform 0.2s ease-out, box-shadow 0.35s ease, border-color 0.35s ease;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 20px;
      padding: 1px;
      background: linear-gradient(130deg,
        var(--accent), transparent 30%,
        transparent 70%, var(--green));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0.6;
      pointer-events: none;
    }

    .card:hover {
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.3),
        0 28px 70px rgba(0, 0, 0, 0.65),
        0 0 70px var(--glow);
      border-color: rgba(88, 166, 255, 0.35);
    }

    .winbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.7rem 1.1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px 20px 0 0;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .winbar .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .winbar .dot.r { background: #ff5f57; }
    .winbar .dot.y { background: #febc2e; }
    .winbar .dot.g { background: #28c840; }

    .winbar .path {
      margin-left: 0.6rem;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .winbar .path b { color: var(--green); font-weight: 600; }

    .winbar .online {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--green);
    }

    .winbar .online .ring {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px rgba(63, 185, 80, 0.7);
      animation: ring-pulse 2s ease-in-out infinite;
    }

    @keyframes ring-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .card > .card-inner {
      animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: scale(0.92) translateY(30px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .prompt {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.78rem;
      color: var(--accent);
      margin-bottom: 0.9rem;
      text-align: left;
    }

    .cursor {
      display: inline-block;
      width: 7px;
      height: 13px;
      background: var(--accent);
      margin-left: 3px;
      vertical-align: -2px;
      animation: caret 1s steps(1) infinite;
    }

    @keyframes caret {
      50% { opacity: 0; }
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 0.3px;
      background: linear-gradient(90deg, var(--accent), var(--orange), var(--green), var(--accent));
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: gradientMove 6s ease-in-out infinite;
    }

    @keyframes gradientMove {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .role-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 1rem 0 0.4rem;
    }

    .role-row .ping {
      position: relative;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .role-row .ping::after {
      content: "";
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 1px solid var(--accent);
      opacity: 0;
      animation: ping 2.2s ease-out infinite;
    }

    @keyframes ping {
      0%   { opacity: 0.6; transform: scale(0.6); }
      100% { opacity: 0; transform: scale(1.8); }
    }

    .role {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.92rem;
      letter-spacing: 0.02em;
      color: var(--accent);
      font-weight: 600;
    }

    .bg-line {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.72rem;
      color: var(--muted);
      margin: 0 0 1.4rem;
    }

    .typing {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.82rem;
      color: var(--muted);
      min-height: 1.6em;
      margin-bottom: 1.4rem;
    }

    .typing .prompt { color: var(--green); }
    .typing .cmd { color: var(--accent); }
    .typing .caret {
      display: inline-block;
      width: 8px;
      height: 1.05em;
      background: var(--text);
      vertical-align: text-bottom;
      margin-left: 2px;
      animation: caret 1s steps(1) infinite;
    }

    .section-label {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 0.75rem;
      text-align: left;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .skill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0.45rem 0.95rem;
      border-radius: 999px;
      background: rgba(88, 166, 255, 0.08);
      border: 1px solid rgba(88, 166, 255, 0.28);
      color: var(--text);
      font-size: 0.83rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
      cursor: default;
      animation: pop-in 0.45s ease forwards;
      opacity: 0;
    }

    .skill::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.25s ease, box-shadow 0.25s ease;
    }

    .skill:nth-child(1) { animation-delay: 0.3s; }
    .skill:nth-child(2) { animation-delay: 0.36s; }
    .skill:nth-child(3) { animation-delay: 0.42s; }
    .skill:nth-child(4) { animation-delay: 0.48s; }
    .skill:nth-child(5) { animation-delay: 0.54s; }

    @keyframes pop-in {
      from { opacity: 0; transform: translateY(6px) scale(0.94); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .skill:hover {
      transform: translateY(-3px) scale(1.05);
      background: rgba(88, 166, 255, 0.2);
      box-shadow: 0 6px 20px rgba(88, 166, 255, 0.35);
    }

    .skill:hover::before {
      background: var(--accent);
      box-shadow: 0 0 6px var(--glow);
    }

    .fact {
      position: relative;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.82rem;
      line-height: 1.7;
      color: var(--muted);
      background: rgba(88, 166, 255, 0.05);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      padding: 0.9rem 1rem;
      border-radius: 8px;
      text-align: left;
      transition: border-color 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
    }

    .fact:hover {
      background: rgba(88, 166, 255, 0.1);
      border-left-color: var(--green);
      box-shadow: 0 0 20px rgba(88, 166, 255, 0.15);
    }

    .fact .hash {
      color: var(--accent);
      font-weight: 700;
      margin-right: 0.3rem;
    }

    .footer-line {
      display: flex;
      justify-content: space-between;
      margin-top: 1.2rem;
      padding-top: 0.9rem;
      border-top: 1px solid var(--border);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .footer-line .accent-text { color: var(--accent); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
      }
      .skill { opacity: 1 !important; }
      canvas { display: none; }
    }

    @media (max-width: 420px) {
      .card { padding: 2.25rem 1.3rem; }
      h1 { font-size: 1.45rem; }
    }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="card" id="card">
    <div class="winbar">
      <span class="dot r"></span>
      <span class="dot y"></span>
      <span class="dot g"></span>
      <span class="path">~/aziman/profile</span>
      <span class="online"><span class="ring"></span>online</span>
    </div>

    <div class="card-inner" style="margin-top: 2.4rem">
      <p class="prompt">whoami<span class="cursor"></span></p>
      <h1>Muhammad Aziman</h1>

      <div class="role-row">
        <span class="ping"></span>
        <span class="role">Cloud Support Trainee</span>
      </div>

      <p class="bg-line">Field Service Engineer · NCR ATLEOS</p>

      <p class="typing"><span class="prompt">$</span> <span class="cmd" id="typed"></span><span class="caret"></span></p>

      <p class="section-label">Kemahiran</p>
      <div class="skills">
        <span class="skill">Linux</span>
        <span class="skill">Git</span>
        <span class="skill">Docker</span>
        <span class="skill">ATM / POS Systems</span>
        <span class="skill">Field Diagnostics</span>
      </div>

      <p class="fact"><span class="hash">#</span>seorang tukang cloud — bermula dari baiki ATM, kini bina sistem &amp; infrastruktur digital.</p>

      <div class="footer-line">
        <span>status: <span class="accent-text">active</span></span>
        <span>build v1.0</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (!reduce) {
        var canvas = document.getElementById("stars");
        var ctx = canvas.getContext("2d");
        var stars = [];
        var W, H;

        function resize() {
          W = canvas.width = window.innerWidth;
          H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener("resize", resize);

        var count = Math.min(80, Math.floor(window.innerWidth / 18));
        for (var i = 0; i < count; i++) {
          stars.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            r: Math.random() * 1.4 + 0.4,
            s: Math.random() * 0.4 + 0.1,
            a: Math.random() * Math.PI * 2
          });
        }

        function draw() {
          ctx.clearRect(0, 0, W, H);
          for (var i = 0; i < stars.length; i++) {
            var st = stars[i];
            st.y -= st.s;
            if (st.y < -5) { st.y = H + 5; st.x = Math.random() * W; }
            var tw = 0.5 + 0.5 * Math.sin(st.a += 0.05);
            ctx.beginPath();
            ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(230, 237, 243, " + (0.25 + tw * 0.45) + ")";
            ctx.fill();
          }
          requestAnimationFrame(draw);
        }
        draw();

        var card = document.getElementById("card");
        card.addEventListener("mousemove", function (e) {
          if (window.innerWidth < 768) return;
          var r = card.getBoundingClientRect();
          var px = (e.clientX - r.left) / r.width - 0.5;
          var py = (e.clientY - r.top) / r.height - 0.5;
          card.style.transform =
            "perspective(900px) rotateX(" + (-py * 8) + "deg) rotateY(" + (px * 8) + "deg)";
        });
        card.addEventListener("mouseleave", function () {
          card.style.transform = "";
        });
      }

      var lines = [
        "whoami  →  Muhammad Aziman",
        "sudo fix --everything",
        "docker run -d tukang-cloud",
        "systemctl is-active aziman@cloud"
      ];
      var li = 0, ci = 0, running = false;

      function type() {
        var el = document.getElementById("typed");
        if (!running) {
          running = true;
          el.textContent = "";
          ci = 0;
        }
        if (ci <= lines[li].length) {
          el.textContent = lines[li].slice(0, ci++);
          setTimeout(type, 55);
        } else {
          setTimeout(function () {
            el.textContent = "";
            running = false;
            li = (li + 1) % lines.length;
            setTimeout(type, 900);
          }, 1900);
        }
      }
      setTimeout(type, 1400);
    })();
  </script>
</body>
</html>
