<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aziman — Cloud Support Trainee</title>
<style>
  :root{
    --bg: #0f1416;
    --panel: #161d20;
    --panel-edge: #232c30;
    --text: #e7ecee;
    --muted: #7f9099;
    --accent: #e2a339;
    --accent-dim: #7a5a22;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background:
      radial-gradient(circle at 50% 0%, rgba(226,163,57,0.06), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 440px;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
  }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: #12181b;
    border-bottom: 1px solid var(--panel-edge);
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #3a4448;
  }

  .titlebar span.path {
    margin-left: 8px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }

  .content {
    padding: 36px 32px 32px;
  }

  .prompt {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
    margin: 0 0 6px;
  }

  h1 {
    font-family: var(--sans);
    font-size: 30px;
    font-weight: 650;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
    color: var(--text);
  }

  .role {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--muted);
    margin: 0 0 28px;
  }

  .role::before {
    content: "";
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 8px;
    vertical-align: middle;
  }

  .section-label {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 10px;
  }

  .skills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 26px;
  }

  .skill {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    background: #1d262a;
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    padding: 5px 10px;
  }

  .fact {
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
    color: var(--muted);
    background: #12181b;
    border-left: 2px solid var(--accent-dim);
    padding: 12px 14px;
    border-radius: 4px;
    margin: 0;
  }

  .fact strong {
    color: var(--accent);
    font-weight: 500;
  }

  @media (prefers-reduced-motion: no-preference) {
    .card { animation: rise 0.5s ease-out; }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  a:focus-visible, .card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>
</head>
<body>

  <main class="card">
    <div class="titlebar">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="path">~/aziman</span>
    </div>

    <div class="content">
      <p class="prompt">whoami</p>
      <h1>Aziman</h1>
      <p class="role">Cloud Support Trainee</p>

      <p class="section-label">kemahiran</p>
      <div class="skills">
        <span class="skill">Linux</span>
        <span class="skill">Git</span>
        <span class="skill">Docker</span>
      </div>

      <p class="fact"><strong>#</strong> seorang tukang cloud — dulu repair mesin, sekarang bina sistem.</p>
    </div>
  </main>

</body>
</html>
