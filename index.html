<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muhammad Aziman — Tukang Repair Machine</title>
<style>
  :root{
    --bg: #0a0d0f;
    --panel: #12171a;
    --panel-2: #0e1315;
    --edge: #212a2e;
    --edge-soft: #1a2225;
    --text: #eef2f3;
    --muted: #7d8d94;
    --muted-dim: #4d5a5f;
    --accent: #e2a339;
    --accent-2: #d97757;
    --accent-glow: rgba(226,163,57,0.35);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    background:
      radial-gradient(circle at 20% 15%, rgba(226,163,57,0.05), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(217,119,87,0.05), transparent 45%),
      var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  /* faint dot grid, like a schematic backdrop */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 26px 26px;
    mask-image: radial-gradient(circle at 50% 45%, black 0%, transparent 72%);
    pointer-events: none;
  }

  .glow {
    position: fixed;
    width: 640px;
    height: 640px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(226,163,57,0.09), transparent 65%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: drift 14s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes drift {
    0%, 100% { transform: translate(-55%, -52%) scale(1); }
    50% { transform: translate(-45%, -48%) scale(1.12); }
  }

  .particle {
    position: fixed;
    width: 2px;
    height: 2px;
    background: var(--muted);
    border-radius: 50%;
    opacity: 0;
    animation: float 10s linear infinite;
    pointer-events: none;
  }

  @keyframes float {
    0%   { opacity: 0; transform: translateY(0); }
    10%  { opacity: 0.3; }
    90%  { opacity: 0.18; }
    100% { opacity: 0; transform: translateY(-160px); }
  }

  /* card wrapper carries the gradient-border glow */
  .card-wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 460px;
    border-radius: 16px;
    padding: 1px;
    background: linear-gradient(155deg, rgba(226,163,57,0.35), rgba(33,42,46,0.4) 30%, rgba(217,119,87,0.18) 100%);
    animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 40px 80px -30px rgba(0,0,0,0.7);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card {
    position: relative;
    background: var(--panel);
    border-radius: 15px;
    overflow: hidden;
    transition: transform 0.4s ease;
  }

  .card-wrap:hover .card { transform: translateY(-2px); }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 13px 18px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--edge);
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #333e42;
  }

  .dot:nth-child(3) { animation: blink-dot 2.6s ease-in-out infinite; }

  @keyframes blink-dot {
    0%, 78%, 100% { background: #333e42; box-shadow: none; }
    40% { background: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
  }

  .titlebar .path {
    margin-left: 6px;
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.02em;
    color: var(--muted-dim);
  }

  .titlebar .status {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status .ring {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #3ecf8e;
    box-shadow: 0 0 6px rgba(62,207,142,0.6);
    animation: ring-pulse 2s ease-in-out infinite;
  }

  @keyframes ring-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }

  .content {
    padding: 38px 34px 34px;
    opacity: 0;
    animation: content-in 0.6s ease 0.18s forwards;
  }

  @keyframes content-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .prompt {
    font-family: var(--mono);
    font-size: 12.5px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 10px;
  }

  .cursor {
    display: inline-block;
    width: 6px;
    height: 12px;
    background: var(--accent);
    margin-left: 3px;
    vertical-align: -1px;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    50.01%, 100% { opacity: 0; }
  }

  h1 {
    font-size: 27px;
    font-weight: 650;
    letter-spacing: -0.015em;
    line-height: 1.15;
    margin: 0 0 6px;
    background: linear-gradient(120deg, var(--text) 40%, var(--accent) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .role-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 30px;
  }

  .role-row .ping {
    position: relative;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  .role-row .ping::after {
    content: "";
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    border: 1px solid var(--accent);
    opacity: 0;
    animation: ping 2.2s ease-out infinite;
  }

  @keyframes ping {
    0%   { opacity: 0.6; transform: scale(0.6); }
    100% { opacity: 0; transform: scale(1.8); }
  }

  .role {
    font-family: var(--mono);
    font-size: 13.5px;
    letter-spacing: 0.01em;
    color: var(--muted);
  }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, var(--edge), transparent);
    margin: 0 0 26px;
  }

  .section-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted-dim);
    margin: 0 0 12px;
  }

  .skills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 28px;
  }

  .skill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--edge);
    border-radius: 7px;
    padding: 6px 11px;
    opacity: 0;
    animation: pop-in 0.45s ease forwards;
    transition: border-color 0.25s ease, transform 0.25s ease, background 0.25s ease;
  }

  .skill::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--muted-dim);
    transition: background 0.25s ease, box-shadow 0.25s ease;
  }

  .skill:hover {
    border-color: var(--accent-dim, var(--accent));
    background: #182024;
    transform: translateY(-1px);
  }

  .skill:hover::before {
    background: var(--accent);
    box-shadow: 0 0 5px var(--accent-glow);
  }

  .skill:nth-child(1) { animation-delay: 0.38s; }
  .skill:nth-child(2) { animation-delay: 0.48s; }
  .skill:nth-child(3) { animation-delay: 0.58s; }

  @keyframes pop-in {
    from { opacity: 0; transform: translateY(4px) scale(0.94); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .fact {
    position: relative;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.65;
    color: var(--muted);
    background: var(--panel-2);
    border: 1px solid var(--edge-soft);
    border-left: 2px solid var(--accent);
    padding: 13px 15px;
    border-radius: 6px;
    margin: 0;
    opacity: 0;
    animation: content-in 0.5s ease 0.75s forwards;
    transition: border-color 0.3s ease, background 0.3s ease;
  }

  .fact:hover {
    background: #151c1f;
  }

  .fact strong {
    color: var(--accent);
    font-weight: 500;
  }

  .footer-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px;
    background: var(--panel-2);
    border-top: 1px solid var(--edge);
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted-dim);
    letter-spacing: 0.03em;
  }

  .footer-line .accent-text { color: var(--accent); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      opacity: 1 !important;
      transition: none !important;
    }
  }

  @media (max-width: 480px) {
    .content { padding: 30px 24px 26px; }
    h1 { font-size: 23px; }
  }
</style>
</head>
<body>

  <div class="glow"></div>

  <div class="card-wrap">
    <main class="card">
      <div class="titlebar">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="path">~/aziman/profile</span>
        <span class="status"><span class="ring"></span>online</span>
      </div>

      <div class="content">
        <p class="prompt">whoami<span class="cursor"></span></p>
        <h1>Muhammad Aziman</h1>
        <div class="role-row">
          <span class="ping"></span>
          <span class="role">Tukang Repair Machine</span>
        </div>

        <div class="divider"></div>

        <p class="section-label">Kemahiran</p>
        <div class="skills">
          <span class="skill">Linux</span>
          <span class="skill">Git</span>
          <span class="skill">Docker</span>
        </div>

        <p class="fact"><strong>#</strong> seorang tukang cloud — dulu repair mesin, sekarang bina sistem.</p>
      </div>

      <div class="footer-line">
        <span>status: <span class="accent-text">active</span></span>
        <span>build v1.0</span>
      </div>
    </main>
  </div>

  <script>
    (function(){
      var count = 16;
      for (var i = 0; i < count; i++) {
        var p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.top = (55 + Math.random() * 45) + 'vh';
        p.style.animationDelay = (Math.random() * 10) + 's';
        p.style.animationDuration = (8 + Math.random() * 6) + 's';
        document.body.appendChild(p);
      }
    })();
  </script>

</body>
</html>
