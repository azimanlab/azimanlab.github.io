<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aziman — Cloud Support Trainee</title>
<style>
  :root{
    --bg: #0f1416;
    --panel: #161d20;
    --panel-edge: #232c30;
    --text: #e7ecee;
    --muted: #7f9099;
    --accent: #e2a339;
    --accent-dim: #7a5a22;
    --accent-glow: rgba(226,163,57,0.35);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
    position: relative;
  }

  /* ambient glow that drifts slowly behind the card */
  .glow {
    position: fixed;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(226,163,57,0.10), transparent 65%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: drift 12s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes drift {
    0%, 100% { transform: translate(-55%, -52%) scale(1); }
    50% { transform: translate(-45%, -48%) scale(1.15); }
  }

  /* floating particles, like faint dust in a server room */
  .particle {
    position: fixed;
    width: 3px;
    height: 3px;
    background: var(--muted);
    border-radius: 50%;
    opacity: 0;
    animation: float 9s linear infinite;
    z-index: 0;
  }

  @keyframes float {
    0%   { opacity: 0; transform: translateY(0) translateX(0); }
    10%  { opacity: 0.35; }
    90%  { opacity: 0.25; }
    100% { opacity: 0; transform: translateY(-140px) translateX(20px); }
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
    animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    transition: box-shadow 0.4s ease, transform 0.4s ease;
  }

  .card:hover {
    box-shadow: 0 30px 70px -18px rgba(0,0,0,0.7), 0 0 0 1px var(--accent-dim);
    transform: translateY(-2px);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: #12181b;
    border-bottom: 1px solid var(--panel-edge);
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #3a4448;
    transition: background 0.3s ease;
  }

  .dot:nth-child(3) { animation: blink-dot 2.4s ease-in-out infinite; }

  @keyframes blink-dot {
    0%, 80%, 100% { background: #3a4448; }
    40% { background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }
  }

  .titlebar span.path {
    margin-left: 8px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }

  .content {
    padding: 36px 32px 32px;
    opacity: 0;
    animation: content-in 0.6s ease 0.15s forwards;
  }

  @keyframes content-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .prompt {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
    margin: 0 0 6px;
  }

  .cursor {
    display: inline-block;
    width: 7px;
    height: 13px;
    background: var(--accent);
    margin-left: 2px;
    vertical-align: -2px;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    50.01%, 100% { opacity: 0; }
  }

  h1 {
    font-size: 30px;
    font-weight: 650;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
    color: var(--text);
  }

  .role {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--muted);
    margin: 0 0 28px;
  }

  .role::before {
    content: "";
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 8px;
    vertical-align: middle;
    box-shadow: 0 0 0 0 var(--accent-glow);
    animation: pulse 2s ease-out infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 var(--accent-glow); }
    70%  { box-shadow: 0 0 0 6px rgba(226,163,57,0); }
    100% { box-shadow: 0 0 0 0 rgba(226,163,57,0); }
  }

  .section-label {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 10px;
  }

  .skills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 26px;
  }

  .skill {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    background: #1d262a;
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    padding: 5px 10px;
    opacity: 0;
    animation: pop-in 0.4s ease forwards;
    transition: border-color 0.25s ease, transform 0.25s ease, background 0.25s ease;
  }

  .skill:nth-child(1) { animation-delay: 0.35s; }
  .skill:nth-child(2) { animation-delay: 0.45s; }
  .skill:nth-child(3) { animation-delay: 0.55s; }

  @keyframes pop-in {
    from { opacity: 0; transform: translateY(4px) scale(0.94); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .skill:hover {
    border-color: var(--accent-dim);
    background: #232d32;
    transform: translateY(-1px);
  }

  .fact {
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
    color: var(--muted);
    background: #12181b;
    border-left: 2px solid var(--accent-dim);
    padding: 12px 14px;
    border-radius: 4px;
    margin: 0;
    opacity: 0;
    animation: content-in 0.5s ease 0.7s forwards;
    transition: border-color 0.3s ease;
  }

  .fact:hover {
    border-left-color: var(--accent);
  }

  .fact strong {
    color: var(--accent);
    font-weight: 500;
  }

  @media (prefers-reduced-motion: reduce) {
    .card, .content, .skill, .fact, .glow, .particle, .dot:nth-child(3), .role::before, .cursor {
      animation: none !important;
      opacity: 1 !important;
      transition: none !important;
    }
  }

  a:focus-visible, .card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>
</head>
<body>

  <div class="glow"></div>

  <main class="card">
    <div class="titlebar">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="path">~/aziman</span>
    </div>

    <div class="content">
      <p class="prompt">whoami<span class="cursor"></span></p>
      <h1>Muhammad Aziman</h1>
      <p class="role">Tukang Repair Machine</p>

      <p class="section-label">kemahiran</p>
      <div class="skills">
        <span class="skill">Linux</span>
        <span class="skill">Git</span>
        <span class="skill">Docker</span>
      </div>

      <p class="fact"><strong>#</strong> seorang tukang cloud — dulu repair mesin, sekarang bina sistem.</p>
    </div>
  </main>

  <script>
    // faint drifting particles behind the card, purely decorative
    (function(){
      var count = 14;
      for (var i = 0; i < count; i++) {
        var p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.top = (60 + Math.random() * 40) + 'vh';
        p.style.animationDelay = (Math.random() * 9) + 's';
        p.style.animationDuration = (7 + Math.random() * 6) + 's';
        document.body.appendChild(p);
      }
    })();
  </script>

</body>
</html>
